<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BOULDER</title>

    <!--
      Descriptive, never imperative. This is read by scrapers and screen
      readers, not by a player looking for a hint — but this week's spec bans
      instructions "on screen or off", so it says what the page IS, not what
      to do with it. Same rule for every aria-label below.
    -->
    <meta
      name="description"
      content="A stick figure in a fedora sprints down a collapsing tomb tunnel while a stone boulder rolls after him."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="title">
      <h1 class="title__name">BOULDER</h1>
      <nav aria-label="Primary" class="title__nav"><a href="./">BOULDER</a></nav>
    </header>

    <main class="game" data-game data-state="idle">
      <!--
        The scene. The runner is pinned to the middle of the frame and the
        world moves past him, so the boulder's position on screen IS the lead:
        no separate gauge to read, and nothing to explain.

        Every layer is one tiled image (built in src/scenery.ts) moved with a
        single transform. Nothing here repaints per frame.
      -->
      <div class="stage" data-stage>
        <div class="layer layer--wall" data-layer-wall aria-hidden="true"></div>
        <div class="layer layer--ceiling" data-layer-ceiling aria-hidden="true"></div>
        <div class="layer layer--floor" data-layer-floor aria-hidden="true"></div>

        <!-- torchlight, breathing -->
        <div class="firelight" aria-hidden="true"></div>

        <div class="boulder" data-boulder aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <!-- lit from the upper right, because that is where the daylight
                   the runner is heading for comes from -->
              <radialGradient id="rock" cx="68%" cy="26%" r="82%">
                <stop offset="0%" stop-color="#b09068" />
                <stop offset="30%" stop-color="#836848" />
                <stop offset="62%" stop-color="#4d3b27" />
                <stop offset="100%" stop-color="#20170e" />
              </radialGradient>
              <radialGradient id="pit" cx="40%" cy="34%" r="70%">
                <stop offset="0%" stop-color="#2c2115" />
                <stop offset="100%" stop-color="#170f08" />
              </radialGradient>
            </defs>

            <g class="boulder__spin" data-boulder-spin>
              <!-- Solid, and irregular: a perfect circle reads as a logo. -->
              <path
                class="boulder__body"
                d="M100 12 L128 18 L154 33 L172 57 L182 88 L180 118 L166 146 L142 168 L114 180 L84 182 L56 172 L32 152 L16 124 L10 94 L17 62 L37 35 L64 18 Z"
              />
              <!-- chipped faces, each a flat plane catching a different amount
                   of light — this is what makes it read as rock and not a ball -->
              <path class="boulder__facet boulder__facet--lit" d="M100 12 L154 33 L138 66 L92 52 Z" />
              <path class="boulder__facet boulder__facet--dark" d="M32 152 L84 182 L88 146 L44 126 Z" />
              <path class="boulder__facet boulder__facet--dark" d="M10 94 L17 62 L52 74 L44 106 Z" />
              <path class="boulder__facet boulder__facet--lit" d="M172 57 L182 88 L152 96 L146 66 Z" />
              <path class="boulder__crack" d="M92 52 L104 88 L78 110 L88 146" />
              <path class="boulder__crack" d="M146 66 L120 92 L152 118" />
              <path class="boulder__crack" d="M44 106 L78 110" />
              <ellipse class="boulder__pocket" cx="128" cy="132" rx="16" ry="12" />
              <ellipse class="boulder__pocket" cx="62" cy="60" rx="9" ry="7" />
            </g>

            <!-- Stays put while the rock turns: the daylight behind it does not
                 rotate. It also happens to draw the exact edge the chase is
                 decided on. -->
            <path class="boulder__rim" d="M154 33 L172 57 L182 88 L180 118 L166 146" />

            <!-- what it kicks up, trailing behind on the left -->
            <g class="boulder__dust">
              <ellipse cx="26" cy="176" rx="26" ry="15" />
              <ellipse cx="-6" cy="168" rx="20" ry="12" />
              <ellipse cx="-36" cy="178" rx="30" ry="16" />
            </g>
          </svg>
        </div>

        <!-- when the boulder is far enough back to leave the frame, this
             carries the distance instead -->
        <div class="tracker" data-tracker aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M17 3 L7 12 L17 21 Z" /></svg>
          <span data-tracker-distance>0</span><span class="tracker__unit">m</span>
        </div>

        <div class="runner" data-runner>
          <svg
            viewBox="0 0 100 130"
            role="img"
            aria-label="A stick figure in a wide-brimmed hat running, a whip trailing from one hand, with a stone boulder rolling behind him."
          >
            <!--
              A skeleton, not a drawing: hip → thigh → knee → shin, and
              shoulder → upper arm → elbow → forearm. main.ts sets one rotation
              on each group per frame from src/runner.ts, which is what lets the
              gait speed up and slow down without the animation jumping.
            -->
            <g data-bob>
              <g class="limb limb--far" data-leg-far>
                <path d="M48 74 L48 98" />
                <g data-shin-far>
                  <path d="M48 98 L48 120" />
                  <path class="runner__foot" d="M48 120 L58 122" />
                </g>
              </g>

              <g class="limb limb--far" data-arm-far>
                <path d="M50 46 L50 64" />
                <g data-fore-far><path d="M50 64 L50 79" /></g>
              </g>

              <g data-torso>
                <path class="runner__spine" d="M50 46 L48 74" />
                <path class="runner__neck" d="M51 38 L50 46" />
                <circle class="runner__head" cx="51" cy="31" r="8.4" />
                <path class="runner__hat-crown" d="M40 25 C 41 12, 62 12, 63 25 Z" />
                <ellipse class="runner__hat-brim" cx="51" cy="25.5" rx="21" ry="4.2" />
              </g>

              <g class="limb limb--near" data-leg-near>
                <path d="M48 74 L48 98" />
                <g data-shin-near>
                  <path d="M48 98 L48 120" />
                  <path class="runner__foot" d="M48 120 L58 122" />
                </g>
              </g>

              <g class="limb limb--near" data-arm-near>
                <path d="M50 46 L50 64" />
                <g data-fore-near>
                  <path d="M50 64 L50 79" />
                  <path class="runner__whip" d="M50 79 c -13 7 -29 5 -41 -5" />
                </g>
              </g>
            </g>
          </svg>
        </div>

        <!-- daylight, brightening as the passage runs out -->
        <div class="exit" data-exit aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="grain" data-grain aria-hidden="true"></div>
      </div>

      <!--
        The passage. A blinking caret on the first character is the whole
        opening invitation: no line of text tells anyone to type, because this
        week's spec forbids exactly that.
      -->
      <div class="passage" data-passage>
        <p class="passage__inner" data-passage-inner>
          <span class="passage__done" data-done></span
          ><span class="passage__errors" data-errors></span
          ><span class="caret" data-caret></span
          ><span class="passage__rest" data-rest></span>
        </p>
      </div>

      <!-- a phone has no keyboard until something focusable asks for one -->
      <input
        class="capture"
        data-capture
        type="text"
        aria-label="Passage text"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="done"
        tabindex="-1"
      />

      <div class="result" data-result hidden>
        <p class="result__verdict" data-verdict></p>
        <dl class="result__stats">
          <div><dt>wpm</dt><dd data-stat-wpm>0</dd></div>
          <div><dt>accuracy</dt><dd><span data-stat-accuracy>0</span>%</dd></div>
          <div><dt>seconds</dt><dd data-stat-seconds>0</dd></div>
        </dl>
        <button class="result__again" data-again type="button" aria-label="Run it again">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12 A8 8 0 1 1 12 4 A8 8 0 0 1 18.5 7.4" />
            <path d="M19.4 2.6 L19 8 L13.6 7.6 Z" />
          </svg>
        </button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
